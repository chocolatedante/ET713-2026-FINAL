{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Upload Notes</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Upload Image</button>
    </form>

    <h2>Your Uploaded Notes</h2>

    {% for upload in uploads %}
        <div class="item">
            <img src="{{ url_for('static', filename='uploads/' + upload['filename']) }}" class="note-img">
            <p>{{ upload["filename"] }}</p>
            <a href="{{ url_for('static', filename='uploads/' + upload['filename']) }}" download>Download</a>
        </div>
    {% else %}
        <p>No uploads yet.</p>
    {% endfor %}
</div>
{% endblock %}
