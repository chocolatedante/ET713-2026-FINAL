{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>To-Do List</h1>

    <form method="POST">
        <input type="text" name="title" placeholder="Task title" required>
        <input type="text" name="category" placeholder="Category">
        <button type="submit">Add Task</button>
    </form>

    <h2>Your Tasks</h2>

    {% for task in tasks %}
        <div class="item">
            <p>
                {% if task["completed"] %}
                     <s>{{ task["title"] }}</s>
                {% else %}
                    {{ task["title"] }}
                {% endif %}
            </p>
            <small>Category: {{ task["category"] }}</small>
            <br>
            <a href="/complete_task/{{ task['id'] }}">Complete</a>
            <a href="/delete_task/{{ task['id'] }}">Delete</a>
        </div>
    {% else %}
        <p>No tasks yet.</p>
    {% endfor %}
</div>
{% endblock %}
